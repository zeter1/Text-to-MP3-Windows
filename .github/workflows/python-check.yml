name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python source
        shell: pwsh
        run: python -m py_compile text_to_mp3.py
