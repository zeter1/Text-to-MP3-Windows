name: Python checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: text-to-mp3-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-contracts:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install runtime dependencies for tests
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Compile Python source and tests
        shell: pwsh
        run: python -m compileall -q text_to_mp3.py tests build_support

      - name: Run offline repository contract tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Verify SAPI and FFmpeg dependencies
        shell: pwsh
        run: python -c "import sys; sys.argv=['package_runtime','--self-test']; import build_support.package_runtime"

      - name: Build and smoke-test packaged EXE
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: cmd
        run: build_exe.bat --ci

      - name: Verify packaged distribution
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: |
          $exe = 'dist\Text-to-MP3-Windows\Text-to-MP3-Windows.exe'
          if (-not (Test-Path $exe)) { throw 'Packaged EXE was not created' }
          if (-not (Test-Path 'dist\Text-to-MP3-Windows\runtime')) { throw 'Packaged runtime folder is missing' }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Create portable ZIP and checksum
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: |
          $zip = 'dist\Text-to-MP3-Windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'dist\Text-to-MP3-Windows\*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Text-to-MP3-Windows-x64.zip" | Set-Content 'dist\Text-to-MP3-Windows-x64.sha256.txt' -Encoding ascii
          Get-Item $zip | Format-List Name,Length,LastWriteTime
          Get-Content 'dist\Text-to-MP3-Windows-x64.sha256.txt'

      - name: Upload packaged Windows distribution
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Text-to-MP3-Windows-x64
          path: |
            dist/Text-to-MP3-Windows-x64.zip
            dist/Text-to-MP3-Windows-x64.sha256.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: syntax-and-contracts
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Require fresh Russian release notes on package pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fxq RELEASE_NOTES_RU.md || {
            echo "RELEASE_NOTES_RU.md must be updated in the same [package] commit."
            exit 1
          }

      - name: Download exact distribution built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Text-to-MP3-Windows-x64
          path: release

      - name: Publish GitHub Release with Russian notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="build-$short_sha"
          title="Text to MP3 для Windows — сборка $short_sha"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file RELEASE_NOTES_RU.md
            gh release upload "$tag" release/Text-to-MP3-Windows-x64.zip release/Text-to-MP3-Windows-x64.sha256.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/Text-to-MP3-Windows-x64.zip release/Text-to-MP3-Windows-x64.sha256.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" \
              --notes-file RELEASE_NOTES_RU.md --prerelease
          fi
