name: Sync latest modular source

on:
  push:
    branches:
      - sync-latest-20260924

permissions:
  contents: write

concurrency:
  group: sync-latest-source
  cancel-in-progress: false

jobs:
  unpack:
    if: contains(github.event.head_commit.message, '[sync]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify, unpack and commit latest source
        shell: bash
        run: |
          set -euo pipefail
          payload=".sync/latest-source.tar.gz.b64"

          tr -d '\r\n' < "$payload" | base64 --decode > /tmp/latest-source.tar.gz
          actual="$(sha256sum /tmp/latest-source.tar.gz | awk '{print $1}')"
          expected="89a88800f0174b70a2ac40a5a3fbd7a51cf01e835db54b2e2d5cf7e3dd4d6356"
          [[ "$actual" == "$expected" ]] || {
            echo "Payload SHA-256 mismatch: $actual"
            exit 1
          }

          tar -tzf /tmp/latest-source.tar.gz
          tar -xzf /tmp/latest-source.tar.gz

          python -m compileall -q text_to_mp3.py tts_app
          python -m unittest discover -s tests -v

          rm -rf .sync
          rm -f .github/workflows/sync-latest-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A text_to_mp3.py tts_app .sync .github/workflows/sync-latest-source.yml
          git diff --cached --check
          git commit -m "refactor: sync latest modular source"
          git push origin HEAD:sync-latest-20260924
